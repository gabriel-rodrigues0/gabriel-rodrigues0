name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 06h de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff1a2b&color_dots=#ebedf0,#ffb3b9,#ff6b77,#e0001a,#8c0010
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff1a2b&color_dots=#161616,#4d0008,#80000d,#c4001a,#ff1a2b

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
