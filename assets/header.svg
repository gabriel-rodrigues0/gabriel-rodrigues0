<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="t d">
  <title id="t">Gabriel Rodrigues</title>
  <desc id="d">BI e Automação com IA. Dashboards, automação de rotinas e IA aplicada ao RH.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#12131c"/>
    </linearGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70a5fd"/>
      <stop offset=".5" stop-color="#bf91f3"/>
      <stop offset="1" stop-color="#38bdae"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#70a5fd" stop-opacity=".25"/>
      <stop offset="1" stop-color="#70a5fd" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grade" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'Fira Code', Menlo, monospace; }

    .entra { opacity: 0; animation: entra .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .e1 { animation-delay: .1s; } .e2 { animation-delay: .35s; } .e3 { animation-delay: .6s; }
    @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* frases que se revezam: 4 frases x 3s = ciclo de 12s */
    .frase { opacity: 0; animation: frase 12s infinite; }
    .f2 { animation-delay: 3s; } .f3 { animation-delay: 6s; } .f4 { animation-delay: 9s; }
    @keyframes frase {
      0% { opacity: 0; transform: translateY(6px); }
      3%, 22% { opacity: 1; transform: none; }
      25%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .cursor { animation: pisca 1s steps(1) infinite; }
    @keyframes pisca { 50% { opacity: 0; } }

    /* barras crescendo, cada uma no seu tempo */
    .b { transform-box: fill-box; transform-origin: bottom; animation: sobe 4s ease-in-out infinite alternate; }
    .b2 { animation-delay: -.6s; } .b3 { animation-delay: -1.2s; } .b4 { animation-delay: -1.8s; }
    .b5 { animation-delay: -2.4s; } .b6 { animation-delay: -3s; } .b7 { animation-delay: -3.6s; }
    @keyframes sobe { from { transform: scaleY(.35); } to { transform: scaleY(1); } }

    /* linha de tendência se desenhando */
    .linha { stroke-dasharray: 420; stroke-dashoffset: 420; animation: desenha 6s ease-in-out infinite; }
    @keyframes desenha { 0% { stroke-dashoffset: 420; } 45%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -420; } }
    .ponto { animation: pulsa 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulsa { 50% { transform: scale(1.6); opacity: .5; } }

    @media (prefers-reduced-motion: reduce) {
      .entra, .b, .linha, .ponto, .cursor { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .frase { animation: none; }
      .f1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#grade)"/>
    <rect width="900" height="3" fill="url(#nome)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="279" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- texto -->
  <g transform="translate(48 0)">
    <text class="entra e1 mono" x="0" y="82" font-size="15" fill="#38bdae">&gt; olá, eu sou<tspan class="cursor" fill="#bf91f3"> _</tspan></text>
    <text class="entra e2" x="0" y="132" font-size="46" font-weight="700" fill="url(#nome)">Gabriel Rodrigues</text>
    <g class="entra e3">
      <text class="mono" x="0" y="180" font-size="18" fill="#9aa5ce">$</text>
      <g transform="translate(22 0)">
        <text class="frase f1 mono" x="0" y="180" font-size="18" fill="#e6edf3">BI e Automação com IA</text>
        <text class="frase f2 mono" x="0" y="180" font-size="18" fill="#e6edf3">Dashboards que viram decisão</text>
        <text class="frase f3 mono" x="0" y="180" font-size="18" fill="#e6edf3">Do processo manual ao automático</text>
        <text class="frase f4 mono" x="0" y="180" font-size="18" fill="#e6edf3">Python · PowerShell · JavaScript</text>
      </g>
      <text x="0" y="226" font-size="14" fill="#9aa5ce">Grupo Pro Security  ·  Estudante de ADS  ·  RH Tech</text>
    </g>
  </g>

  <!-- gráfico -->
  <g transform="translate(600 60)">
    <rect x="0" y="0" width="252" height="168" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".07"/>
    <text class="mono" x="16" y="26" font-size="11" fill="#9aa5ce">indicadores.html</text>
    <circle cx="214" cy="22" r="4" fill="#bf91f3" fill-opacity=".7"/>
    <circle cx="228" cy="22" r="4" fill="#70a5fd" fill-opacity=".7"/>
    <g transform="translate(20 148)">
      <rect class="b b1" x="0"   y="-62"  width="20" height="62"  rx="3" fill="url(#barra)"/>
      <rect class="b b2" x="30"  y="-80"  width="20" height="80"  rx="3" fill="url(#barra)"/>
      <rect class="b b3" x="60"  y="-54"  width="20" height="54"  rx="3" fill="url(#barra)"/>
      <rect class="b b4" x="90"  y="-96"  width="20" height="96"  rx="3" fill="url(#barra)"/>
      <rect class="b b5" x="120" y="-74"  width="20" height="74"  rx="3" fill="url(#barra)"/>
      <rect class="b b6" x="150" y="-104" width="20" height="104" rx="3" fill="url(#barra)"/>
      <rect class="b b7" x="180" y="-90"  width="20" height="90"  rx="3" fill="url(#barra)"/>
      <path class="linha" d="M10 -70 L40 -88 L70 -66 L100 -104 L130 -86 L160 -112 L190 -100" fill="none" stroke="#38bdae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="ponto" cx="190" cy="-100" r="4" fill="#38bdae"/>
    </g>
  </g>
</svg>
